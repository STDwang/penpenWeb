 Qt 性能可视化问题构建一个可阅读、可测量的分析演示工具。当前公开版本包含百万教学事件时间线、事件搜索、精确选区统计，以及 PresentMon v1 CSV 的真实帧导入和长帧定位。\"]},{\"title\":\"核心设计\",\"paragraphs\":[\"纯 C++ core 管理紧凑事件结构和每轨道区间索引，Widgets 负责绘制与输入，适配器处理文件格式。后台构建只读快照，使用请求代次、协作取消和待办合并处理快速交互。\"],\"points\":[\"QPainter 自绘、屏幕外裁剪、密集视口 LOD；不为每条事件创建 QObject。\",\"shared_ptr\u003cconst TraceStore\u003e 快照保证读取期间的数据有效性。\",\"精确统计与视觉聚合分开，避免用显示采样结果计算统计。\"]},{\"title\":\"测量：只在明确口径下谈收益\",\"paragraphs\":[\"2026-09-17 首轮 Release 基准使用固定 seed、64 轨道和百万合成事件。100 次窄区间查询的总耗时中位数为 189.406ms（朴素扫描）与 2.7329ms（索引），两种方法校验命中数量一致。\",\"环境为 Windows x64、i7-12700H、约 16GB RAM、Qt 6.8.3、MSVC 19.31。该结果只反映本机这组查询负载；不代表端到端加载、交互 P95 或屏幕帧率。原始 CSV 与复现方法见仓库 benchmarks/reports/BASELINE.md。\"]},{\"title\":\"已有验证与功能边界\",\"paragraphs\":[\"README 2026-10-01 记录 Debug/Release 通过 73 个实际用例。时间线教学轨道为模拟数据；真实数据路径使用 PresentMon v1 指定字段格式。\",\"尚未实现真实 Kernel、指令或调用栈分析，也未完成完整遥测、回放与 Qt Quick 对照。架构文档中的目标设计需与 README 当前实现区分。\"]}],\"boundary\":\"教学分析工具，与微软同名 GPUView 无隶属关系，不是完整 GPU Profiler。项目说明依据公开 README 与基准文档整理；公开代码不自动代表已核验开源许可证。\"},{\"slug\":\"dreamscape\",\"category\":\"lab\",\"title\":\"Dreamscape · 梦境废墟\",\"eyebrow\":\"个人实验 / 程序化场景\",\"summary\":\"程序化建模与场景生成的个人探索。\",\"role\":\"AI 辅助的交互原型探索\",\"stack\":[\"Godot\",\"Blender\",\"GDScript\"],\"image\":\"/images/dreamscape.webp\",\"imageAlt\":\"Dreamscape 实际游戏截图：猫骑士、绿植废墟与程序化场景\",\"source\":\"https://github.com/STDwang/Dreamscape\",\"demo\":\"https://dreamscape-cat.app.workbuddy.host/\",\"demoLabel\":\"项目展示\",\"demoNote\":\"外部项目介绍与截图展示，不是浏览器可玩游戏。\",\"outcome\":\"生成脚本 → 场景 → 实机截图迭代\",\"focus\":\"程序化场景 / 个人原型\",\"sections\":[{\"title\":\"项目想法\",\"paragraphs\":[\"一只穿盔甲的小猫骑士，在被绿植覆盖的废弃小镇中探索。这个实验将程序化角色、场景生成、运行时碰撞与交互组合成可运行的原型。\"]},{\"title\":\"实现路径\",\"paragraphs\":[\"README 记录角色由 GDScript 程序化构建，场景由 Blender bpy 脚本生成并导出 GLB。角色具有眨眼、行走、披风和尾巴等程序动画，场景包含动态生态、雾效与水面表现。\",\"项目通过截图评审与迭代探索视觉效果。公开仓库保留代码和生成脚本，场景资源需要按说明生成，不能将仓库小体积理解为完整美术资源体积。\"]},{\"title\":\"可迁移的经验\",\"paragraphs\":[\"重点在于把想法转成参数、状态、生成脚本和可运行场景，再通过实际画面反馈调整。这些是场景工具与交互原型的探索经验，不等同于机器人动力学或传感器仿真经验。\"]}],\"boundary\":\"画面来自本人项目 README 引用的实机截图。外部站点由独立服务托管，可用性可能变化；README 的工具版本与功能描述以仓库当前记录为准。\"},{\"slug\":\"mistloop\",\"category\":\"lab\",\"title\":\"MISTLOOP / 雾林回环\",\"eyebrow\":\"个人实验 / 交互原型\",\"summary\":\"Three.js、程序化场景、状态机制与声音交互。\",\"role\":\"想法到可运行原型的 AI 辅助实践\",\"stack\":[\"Three.js\",\"Vite\",\"WebGL 2\",\"程序化音频\"],\"image\":\"/images/mistloop.webp\",\"imageAlt\":\"MISTLOOP 在线 Demo 启动后的实际画面：雨雾中的森林、方向提示与圈数状态\",\"source\":\"https://github.com/STDwang/mistloop\",\"demo\":\"https://stdwang.github.io/mistloop/\",\"demoLabel\":\"外部 Demo\",\"outcome\":\"周期性场景、状态规则与声音联动\",\"focus\":\"WebGL 交互 / 个人原型\",\"demoNote\":\"已检查入口与启动画面；未验收完整玩法流程。建议桌面浏览器。\",\"sections\":[{\"title\":\"空间、状态与声音的联动\",\"paragraphs\":[\"一个在浓雾森林中行走的第一人称短片游戏。README 描述了周期性场景、视线之外的状态机制，以及随距离变化的环境声与呼吸声。\"]},{\"title\":\"工程组织\",\"paragraphs\":[\"以 Vite + Three.js 组织原型，设计文档、状态规则、数值配置和程序化音频相互对应。交付不仅包含可运行代码，也保留设计说明、任务拆分与 AI 编码上下文。\",\"周期地形和地标用于构建回环空间，雾控制可见距离，交互事件驱动状态和声音参数。它展示的是可解释的场景规则与交互设计。\"]},{\"title\":\"体验方式\",\"paragraphs\":[\"建议在桌面、支持 WebGL 2 的浏览器中打开外部演示。游戏含恐怖氛围，音频应在用户主动点击后启动；本站不会自动加载该游戏或播放声音。\",\"截图来自实际打开公开 Demo 并点击“进入林子”后的初始运行画面，没有使用目标参考图。已验证入口和启动画面，未验收完整玩法、通关或声音流程，因此同时保留源码入口。\"]}],\"boundary\":\"个人游戏原型，不作为机器人仿真专业经历。画面来自公开 Demo 的初始运行状态，不是概念图；本次启动检查经过代理，不代表国内直连或完整玩法验收通过。\"},{\"slug\":\"imageplayer\",\"category\":\"lab\",\"title\":\"ImagePlayer\",\"eyebrow\":\"早期项目 / 图像工具\",\"summary\":\"多视图对比、图像取反与鸟瞰导航，让图像处理前后的差异直观可见。\",\"role\":\"图像查看与交互工具开发\",\"stack\":[\"C++11\",\"Qt Quick / QML\",\"QImage\",\"QCustomPlot\"],\"image\":\"/images/imageplayer.webp\",\"imageSize\":[1600,900],\"imageAlt\":\"ImagePlayer 实际界面：玩偶照片原图与取反结果的双视图对比、鸟瞰缩略图\",\"imageCaption\":\"本人提供 · 实际运行截图 · 本地路径已遮盖，原图水印保留\",\"screenshots\":[{\"image\":\"/images/imageplayer-photo.webp\",\"alt\":\"ImagePlayer 双视图显示摄影原图和取反结果，每个视图带鸟瞰缩略图\",\"caption\":\"摄影示例 · 原图与取反结果对照，保留鸟瞰图及像素状态栏。\"},{\"image\":\"/images/imageplayer-medical.webp\",\"alt\":\"ImagePlayer 显示网上示例牙片与取反结果，附带文字信息已遮盖\",\"caption\":\"网上示例牙片 · 用户提供；仅展示图像取反，不用于医疗诊断。路径及影像内文字已遮盖。\"}],\"source\":\"https://github.com/STDwang/ImagePlayer\",\"outcome\":\"动态布局 → 拖放缩放 → 取反对比 → 像素查看\",\"focus\":\"C++ / Qt / 早期项目\",\"sections\":[{\"title\":\"多视图中的一致交互\",\"paragraphs\":[\"基于 C++ / Qt Quick 实现多视图图像查看工具。QML 组织动态布局、拖放和以鼠标位置为中心的缩放；鸟瞰图显示当前视野，底部状态栏反馈像素坐标与数值。\",\"本页三张画面均为本人提供的运行截图，展示玩偶、摄影与网上示例牙片的原图/取反对照。普通彩色图像的像素数值当前取红色通道，不表述为所有格式的通用灰度测量。\"]},{\"title\":\"从工具交互理解专业软件\",\"paragraphs\":[\"C++ 图像处理经信号槽与 QML 界面联动，提供图像读取、保存、取反和直方图数据。截图来自本地工作版，普通图片取反修复尚未合入公开默认分支；代码包含 RAW 8/16 位处理及 RAW 自动亮度路径。去噪入口尚未接通后端，不列为已实现功能。\",\"这个项目是我积累专业编辑器输入、图像显示与数据联动经验的起点之一，随后在交通仿真平台中继续处理更复杂的选择和显示问题。\"]}],\"boundary\":\"早期个人图像工具，非医疗诊断软件。示例图片由本人提供，牙片据本人说明来自网上；本地路径与影像内文字已遮盖，玩偶图片原水印保留。图像素材不包含在代码的再授权承诺中；未核验统一许可证，标注为公开代码，不用第三方徽章证明构建状态。\"}],\"label\":\"个人项目\"}],\"$Lc\"]}],[\"$Ld\"],\"$Le\"]}],\"p\":false,\"v\":null}}]]\n8:[[\"children\",{\"s\":\"lab\",\"h\":512,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],\"p\":false,\"v\":\"$9\"},\"c\":\"$Qa\"}]]\n0:{\"P\":null,\"c\":[\"\",\"lab\",\"\"],\"q\":\"\",\"i\":false,\"t\":{\"t\":{\"s\":\"\",\"h\":528,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/penpenWeb/_next/static/chunks/3ge0w87owf_k6.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/penpenWeb/_next/static/chunks/1zjz7f-zzveus.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/penpenWeb/_next/static/chunks/0a2vu7u1pvafm.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"zh-CN\",\"data-scroll-behavior\":\"smooth\
